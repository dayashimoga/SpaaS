name: SPaaS CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-suite:
    name: Test Suite & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Run Unit & Integration Tests
        run: cargo test --workspace -- --nocapture
      - name: Run Security Adversarial Tests
        run: cargo test -p spaas-integration-tests --test adversarial_security -- --nocapture

  web-console-build:
    name: Build Web Console
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build
        env:
          VITE_API_URL: https://spaas-control-plane.dayashimoga.workers.dev
        run: |
          cd apps/web-console
          npm ci
          npm run build
      - name: Upload Web Console Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-console-dist
          path: apps/web-console/dist/

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create spaas-console --production-branch=main || true
          command: pages deploy apps/web-console/dist --project-name=spaas-console --commit-dirty=true

      - name: Verify Cloudflare Pages Live Endpoint
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "Verifying Cloudflare Pages live availability..."
          curl -f -s -I https://spaas-console.pages.dev || echo "Pages deployment pending DNS / initial edge propagation"

  cloudflare-worker-pipeline:
    name: Cloudflare Worker DO Pipeline
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Cloudflare Worker DO Tests & Coverage Gate
        run: |
          cd apps/cloudflare-control-plane
          npm test
      - name: Verify Cloudflare Worker Bundle (Dry Run)
        run: |
          cd apps/cloudflare-control-plane
          npx wrangler deploy --dry-run
      - name: Deploy Primary Control Plane to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/cloudflare-control-plane
          command: deploy
      - name: Post-Deploy Worker Health Verification
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "Verifying live Cloudflare Worker control plane health..."
          WORKER_URL="${SPAAS_WORKER_URL:-https://spaas-control-plane.dayashimoga.workers.dev}"
          for i in $(seq 1 10); do
            RESPONSE=$(curl -f -s "${WORKER_URL}/health" || true)
            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "Live Cloudflare Worker health verified: $RESPONSE"
              exit 0
            fi
            echo "Waiting for edge propagation (attempt $i/10)..."
            sleep 5
          done
          echo "Failed to verify live health at ${WORKER_URL}"
          exit 1

  cloud-run-standby-pipeline:
    name: Cloud Run Standby DR Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloud Run Knative Manifest
        run: |
          grep -q 'minScale: "0"' deploy/cloud-run/service.yaml
          grep -q 'SPAAS_ROLE' deploy/cloud-run/service.yaml
          grep -q 'STANDBY' deploy/cloud-run/service.yaml
          echo "Cloud Run standby manifest verified: 0 min-instances, dormant standby mode"

  build-release-binaries:
    name: Build CLI, Server & Desktop Worker Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Binaries
        run: cargo build --release -p spaas-cli -p spaas-desktop-worker -p spaas-control-plane -p spaas-gateway -p spaas-node-simulator
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: spaas-binaries-${{ matrix.os }}
          path: |
            target/release/spaas
            target/release/spaas.exe
            target/release/spaas-desktop-worker
            target/release/spaas-desktop-worker.exe

  ios-build:
    name: Build iOS Node Companion (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift SPM Build
        run: |
          cd apps/ios-node
          swift build -v

  android-build:
    name: Build Android Node APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build Android Debug APK
        run: |
          cd apps/android-node
          gradle assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: spaas-android-node-apk
          path: apps/android-node/app/build/outputs/apk/debug/app-debug.apk

  sbom-generation:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM via Syft
        uses: anchore/sbom-action@v0
        with:
          format: 'cyclonedx-json'
          output-file: 'spaas-sbom.cdx.json'
      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaas-cyclonedx-sbom
          path: spaas-sbom.cdx.json

  acceptance-gate:
    name: Full Acceptance Gate
    runs-on: ubuntu-latest
    needs: [test-suite, web-console-build, android-build, cloudflare-worker-pipeline, cloud-run-standby-pipeline, sbom-generation]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: spaas-android-node-apk
          path: apps/android-node/app/build/outputs/apk/debug/
      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@v4
        with:
          name: spaas-cyclonedx-sbom
          path: ./
      - name: Install Web Console Deps
        run: cd apps/web-console && npm ci
      - name: Make Scripts Executable
        run: chmod +x scripts/*
      - name: Run Full Acceptance Suite
        run: ./scripts/acceptance
      - name: Generate Checksums & SBOM
        run: |
          sha256sum acceptance-report.json spaas-sbom.cdx.json > checksums.sha256
      - name: Upload Acceptance Report
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-certification-report
          path: |
            acceptance-report.json
            spaas-sbom.cdx.json
            checksums.sha256
