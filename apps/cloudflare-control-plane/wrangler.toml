name = "spaas-control-plane"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "COORDINATOR", class_name = "SPaaSCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SPaaSCoordinator"]

[vars]
SPAAS_ROLE = "PRIMARY"
SPAAS_CONTROL_PLANE_EPOCH = "1"
SPAAS_ENVIRONMENT = "production"
SPAAS_REQUIRE_AUTH = "true"
SPAAS_RATE_LIMIT_RPS = "100"
SPAAS_ALLOWED_ORIGINS = "https://spaas-console.pages.dev"
SPAAS_TEST_CLEAN_BOOTSTRAP = "true"
SPAAS_ALLOW_EVAL_BOOTSTRAP = "false"

# Staging Environment Configuration
[env.staging]
name = "spaas-control-plane-staging"

[env.staging.vars]
SPAAS_ROLE = "PRIMARY"
SPAAS_CONTROL_PLANE_EPOCH = "1"
SPAAS_ENVIRONMENT = "staging"
SPAAS_REQUIRE_AUTH = "true"
SPAAS_RATE_LIMIT_RPS = "50"
SPAAS_ALLOWED_ORIGINS = "https://staging.spaas-console.pages.dev,http://localhost:5173"
SPAAS_TEST_CLEAN_BOOTSTRAP = "false"
SPAAS_ALLOW_EVAL_BOOTSTRAP = "false"

# NOTE: Production secrets (SPAAS_ADMIN_KEY, SPAAS_TURNSTILE_SECRET_KEY, SPAAS_JWT_SECRET)
# must be provisioned via `wrangler secret put <KEY>` and NEVER stored in plaintext.


