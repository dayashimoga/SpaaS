apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: spaas-control-plane-backup
  labels:
    cloud.googleapis.com/location: us-central1
    app.kubernetes.io/name: spaas-control-plane-backup
    app.kubernetes.io/part-of: spaas-fabric
    spaas.io/role: standby
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/spaas-production/spaas-control-plane:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SPAAS_ROLE
              value: "STANDBY"
            - name: SPAAS_EPOCH
              value: "1"
            - name: SPAAS_FENCING_TOKEN
              value: "spaas-epoch-1-token"
            - name: SPAAS_PRIMARY_URL
              value: "https://spaas.edge-compute.workers.dev"
            - name: SPAAS_DATA_DIR
              value: "/data/control-plane"
            - name: RUST_LOG
              value: "info"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
